[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aqua_cortex"
version = "0.1.0"
description = "AquaButler operational awareness layer: Obsidian + live state + kanban RAG"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "WallaceArizona / ultron-aquabutler"},
]
keywords = [
    "aquabutler",
    "obsidian",
    "meilisearch",
    "rag",
    "homelab",
    "embeddings",
    "llama.cpp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Topic :: Text Processing :: Indexing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
]
embed = [
    "tiktoken>=0.7",
]

[project.urls]
Repository = "https://github.com/ultron-aquabutler/aqua_cortex"

[project.scripts]
aqua-cortex-index = "index_obsidian:main"

[tool.setuptools]
py-modules = ["index_obsidian"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cortex*"]
exclude = ["tests*", "deploy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
