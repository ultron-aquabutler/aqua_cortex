# aqua_cortex cron schedule — uses the cluster-wide `docker-tools_cronjob`
# daemon (crazymax/swarm-cronjob in the docker-tools stack) to trigger the
# `aqua_cortex_indexer` service once a day at 03:00 UTC.
#
# Pattern: declare the indexer service with `swarm.cronjob.enable=true`
# + `swarm.cronjob.schedule=@daily` + `swarm.cronjob.schedule-timezone=UTC`.
# The existing docker-tools_cronjob daemon (running on ironman) discovers
# these labels and scales the service from 0 -> 1 at the scheduled time,
# then back to 0 once the task exits.
#
# Deploy:
#   docker --context home-swarm-manager stack deploy \
#     -c deploy/cron-aqua_cortex.yml aqua_cortex
#
# Networking note (verified live 2026-08-26): both Meilisearch and llama.cpp
# are reached via their Traefik-fronted hostnames, NOT overlay VIPs. See
# docker-stack.yml for the full justification.
---
version: "3.8"

networks:
  traefik_proxy:
    external: true
    name: traefik_proxy

secrets:
  meili_master_key:
    external: true
    name: meili_master_key

services:
  aqua_cortex_indexer:
    image: registry.loc.wallacearizona.us/aqua_cortex_indexer:latest
    networks:
      - traefik_proxy
    environment:
      LLAMA_URL: "https://llama.loc.wallacearizona.us"
      LLAMA_MODEL: "Qwen2.5-1.5B-Instruct-Q4_K_M.gguf"
      MEILI_URL: "https://meili.loc.wallacearizona.us"
      MEILI_INDEX: "aqua_cortex"
      MEILI_KEY_FILE: "/run/secrets/meili_master_key"
      AQUA_CORTEX_VAULT_PATHS: "/vault/AquaButler"
    secrets:
      - meili_master_key
    volumes:
      - type: bind
        source: /mnt/Stor1/appdata/obsidian/Obsidian Vault
        target: /vault
        read_only: true
    deploy:
      mode: replicated
      replicas: 0
      restart_policy:
        condition: none
      placement:
        # Pin to ironman — that's the node where the Obsidian NFS vault
        # bind-mount lives, and where docker-tools_cronjob also runs.
        constraints:
          - node.labels.hostname == ironman
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.schedule=@daily"
        - "swarm.cronjob.schedule-timezone=UTC"
        - "swarm.cronjob.skip-running=false"
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
