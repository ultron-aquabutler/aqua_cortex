# aqua_cortex stack — deploy on the HOME swarm.
#
# This file declares the `aqua_cortex_indexer` Swarm service. It runs as a
# replicated-job (replicas: 0) so no task is created until something scales
# it up. The schedule trigger lives in `deploy/cron-aqua_cortex.yml`, which
# is a separate stack (`aqua_cortex`) that targets the same service name
# and adds the `swarm.cronjob.*` labels consumed by the cluster-wide
# `docker-tools_cronjob` daemon (crazymax/swarm-cronjob) running in the
# `docker-tools` stack.
#
# Why two files instead of one stack with both services? The cron-trigger
# pattern (replicas: 0 + swarm.cronjob.* labels) and the ad-hoc run pattern
# (`docker service scale aqua_cortex_aqua_cortex_indexer=1`) are mutually
# exclusive. Keeping them in separate stack files lets each be deployed and
# torn down independently without touching the other.
#
# Important — application-level wiring lives in aqua_cortex.toml, not here.
# Add a new application by editing the [indexer] application= field (or by
# passing AQUA_CORTEX_APPLICATION to the container), NOT by editing this
# compose file.
#
# Networking note (verified live 2026-08-26):
# - docker-tools_meilisearch is on the `traefik_proxy` overlay (NOT a
#   `docker-tools` overlay — that stack namespace has no overlay network
#   of its own). Meili is reached via the Traefik-fronted hostname
#   `https://meili.loc.wallacearizona.us`, which is the only stable URL
#   regardless of where the indexer task lands.
# - llamacpp_llama-server is on Swarm's `host` predefined network. Its
#   port 18080 binds to the host IP directly. Cross-overlay DNS does NOT
#   resolve it. Use the Traefik-fronted `https://llama.loc.wallacearizona.us`.
---
version: "3.8"

networks:
  traefik_proxy:
    external: true
    name: traefik_proxy

secrets:
  meili_master_key:
    external: true
    name: meili_master_key

services:
  aqua_cortex_indexer:
    image: registry.loc.wallacearizona.us/aqua_cortex_indexer:latest
    networks:
      - traefik_proxy
    environment:
      # Traefik-fronted endpoints. Both backends are reachable over the
      # homelab Tailnet from any node, including inside containers that
      # only have traefik_proxy attached. TLS verification is skipped
      # inside the container (cortex/embedder.py + cortex/meili.py both
      # use httpx.AsyncClient(verify=False)); switch to verify=True if
      # you ever ship a production CA into the image.
      LLAMA_URL: "https://llama.loc.wallacearizona.us"
      LLAMA_MODEL: "Qwen2.5-1.5B-Instruct-Q4_K_M.gguf"
      MEILI_URL: "https://meili.loc.wallacearizona.us"
      MEILI_INDEX: "aqua_cortex"
      MEILI_KEY_FILE: "/run/secrets/meili_master_key"
      # application is overridable here per-run; defaults to the value
      # set in aqua_cortex.toml when unset.
      AQUA_CORTEX_VAULT_PATHS: "/vault/AquaButler"
    secrets:
      - meili_master_key
    volumes:
      # RO bind-mount of the Obsidian vault. The vault is the homelab NFS
      # share at /mnt/Stor1/appdata/obsidian/Obsidian Vault/ on the manager
      # node; mount it on every node where the indexer might run (cron can
      # land on any worker).
      - type: bind
        source: /mnt/Stor1/appdata/obsidian/Obsidian Vault
        target: /vault
        read_only: true
    deploy:
      mode: replicated
      replicas: 0
      restart_policy:
        condition: none
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
      placement:
        # Pin to ironman (where the vault bind-mount lives) until we move
        # the vault onto a cluster-wide CSI volume.
        constraints:
          - node.labels.hostname == ironman
      # swarm.cronjob.* labels are picked up by the crazymax/swarm-cronjob
      # daemon declared in deploy/cron-aqua_cortex.yml. They cause the
      # service to scale 0 -> 1 at 03:00 UTC and back to 0 when the task
      # exits.
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.schedule=@daily"
        - "swarm.cronjob.schedule-timezone=UTC"
        - "swarm.cronjob.skip-running=false"
