name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Run smoke indexer test
        run: |
          python -m unittest tests.test_smoke_index -v
